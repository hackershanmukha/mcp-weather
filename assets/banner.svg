<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sun-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="400" rx="20" fill="url(#bg)" />
  <rect width="1198" height="398" x="1" y="1" rx="19" fill="none" stroke="#374151" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="220" r="140" fill="#818cf8" opacity="0.15" filter="url(#glow)" />

  <!-- Weather Icon Graphic -->
  <g transform="translate(100, 110)">
    <!-- Sun Behind Cloud -->
    <circle cx="110" cy="60" r="42" fill="url(#sun-glow)" filter="url(#glow)" opacity="0.8" />
    <circle cx="110" cy="60" r="35" fill="url(#sun-glow)" />
    
    <!-- Cloud -->
    <path d="M 60 130 
             A 35 35 0 0 1 100 80 
             A 45 45 0 0 1 170 85 
             A 35 35 0 0 1 200 130 
             Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="85" cy="115" r="28" fill="#334155" />
    <circle cx="130" cy="95" r="38" fill="#334155" />
    <circle cx="170" cy="115" r="28" fill="#334155" />
    <rect x="85" y="115" width="85" height="28" fill="#334155" />

    <!-- Rain / Sparkles -->
    <line x1="100" y1="155" x2="90" y2="175" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="130" y1="155" x2="120" y2="175" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="160" y1="155" x2="150" y2="175" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Title & Typography -->
  <g transform="translate(360, 130)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">MODEL CONTEXT PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Saige Weather <tspan fill="url(#cyan-blue)">MCP</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Real-time worldwide weather server for Claude Desktop, Cursor &amp; AI Agents.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" />
      <text x="16" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌍 Worldwide</text>

      <!-- Tag 2 -->
      <rect x="150" y="0" width="160" height="32" rx="8" fill="#1e293b" />
      <text x="166" y="21" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Meteo API</text>

      <!-- Tag 3 -->
      <rect x="325" y="0" width="150" height="32" rx="8" fill="#1e293b" />
      <text x="341" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔑 Zero API Keys</text>

      <!-- Tag 4 -->
      <rect x="490" y="0" width="135" height="32" rx="8" fill="#1e293b" />
      <text x="506" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 uvx Ready</text>
    </g>
  </g>
</svg>
