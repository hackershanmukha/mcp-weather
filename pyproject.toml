[project]
name = "saige-weather-mcp"
version = "0.1.0"
description = "A global weather MCP server powered by Open-Meteo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.30.0,<2.0.0",
    "httpx>=0.28.1",
    "nest-asyncio>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "mcp-use>=1.7.0",
    "openai>=3.46.0",
    "fastapi>=0.162.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
saige-weather-mcp = "server.wheater:main"

[project.urls]
Homepage = "https://github.com/hackershanmukha/mcp-weather"
Repository = "https://github.com/hackershanmukha/mcp-weather"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
